name: F01 Kaggle automatic private GPU job
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['.github/workflows/forge-f01-kaggle-gpu-probe.yml']
permissions:
  contents: read
concurrency:
  group: forge-f01-kaggle-gpu-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/forge-r70-surface-lab' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: forge-kaggle
    timeout-minutes: 6
    steps:
      - name: Quota check, create one private GPU smoke job and inspect status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          token=os.environ.get('KAGGLE_API_TOKEN','').strip()
          if not token.startswith('KGAT_') or len(token)<=5 or any(not 33<=ord(c)<=126 for c in token):
              raise SystemExit('Missing or malformed access token')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          def rpc(service,method,body):
              url='https://api.kaggle.com/v1/'+service+'/'+method
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'},method='POST')
              try:
                  with opener.open(req,timeout=45) as r:
                      data=json.loads(r.read(4*1024*1024))
                      print(method+': HTTP '+str(r.status),flush=True)
              except urllib.error.HTTPError as e:raise SystemExit(method+': HTTP '+str(e.code)) from None
              except Exception as e:raise SystemExit(method+': '+type(e).__name__) from None
              if not isinstance(data,dict) or data.get('error') or data.get('errorMessage') or (isinstance(data.get('code'),int) and data['code']>=400):
                  raise SystemExit(method+': API error or unexpected schema')
              return data
          d='datasets.DatasetApiService';k='kernels.KernelsApiService'
          data=rpc(d,'ListDatasets',{'group':'DATASET_SELECTION_GROUP_MY_PRIVATE','pageSize':100})
          refs={row.get('ref','') for row in data.get('datasets',[]) if row.get('isPrivate') is True and re.fullmatch(r'[a-zA-Z0-9_-]+/forge-warrior-test',row.get('ref',''))}
          if len(refs)!=1:raise SystemExit('Owner check failed; no job submitted')
          owner=refs.pop().split('/')[0]
          q=rpc(k,'GetAcceleratorQuotaStatistics',{}).get('gpuQuota')
          if not isinstance(q,dict) or q.get('isPayToScaleEnabled',False) is not False:
              raise SystemExit('Paid scaling enabled or free quota unknown; no job submitted')
          def seconds(value):
              if not isinstance(value,str) or not re.fullmatch(r'\d+(\.\d+)?s',value):raise SystemExit('Quota duration unknown; no job submitted')
              return float(value[:-1])
          remaining=seconds(q.get('totalTimeAllowed'))-seconds(q.get('timeUsed','0s'))-seconds(q.get('timeReserved','0s'))
          if remaining<1800:raise SystemExit('Less than 30 minutes free GPU quota; no job submitted')
          print('FREE_GPU_QUOTA_CHECK_OK; paid scaling disabled',flush=True)
          run=os.environ['GITHUB_RUN_ID']
          assert run.isdigit()
          slug='forge-f01-gpu-probe-'+run
          # One unique new private notebook; no user dataset, no internet, no uploaded secret.
          source='''import json, pathlib, torch
          assert torch.cuda.is_available(), "CUDA unavailable"
          devices=[]
          for i in range(torch.cuda.device_count()):
              x=torch.arange(1024,device="cuda:"+str(i),dtype=torch.int64)
              y=int((x*x).sum().item())
              assert y==357389824
              devices.append({"name":torch.cuda.get_device_name(i),"sum_of_squares":y})
          assert devices
          pathlib.Path("/kaggle/working/forge_gpu_probe.json").write_text(json.dumps({"run_id":RUN_ID,"cuda":True,"devices":devices}))
          print("FORGE_GPU_PROBE_COMPLETE")
          '''.replace('RUN_ID',repr(run))
          compile(source,'gpu_probe.py','exec')
          saved=rpc(k,'SaveKernel',{'slug':owner+'/'+slug,'newTitle':slug.replace('-',' '),'text':source,'language':'python','kernelType':'script','isPrivate':True,'enableGpu':True,'enableInternet':False,'enableTpu':False,'machineShape':'NvidiaTeslaT4','sessionTimeoutSeconds':600,'kernelExecutionType':'SAVE_AND_RUN_ALL','datasetDataSources':[],'kernelDataSources':[],'competitionDataSources':[],'modelDataSources':[]})
          if saved.get('ref')!=owner+'/'+slug or not isinstance(saved.get('versionNumber'),int) or saved['versionNumber']<1:
              raise SystemExit('Save response not verified; do not resubmit automatically')
          print('PRIVATE_GPU_JOB_SUBMITTED version '+str(saved['versionNumber']),flush=True)
          target={'userName':owner,'kernelSlug':slug,'versionLabel':str(saved['versionNumber'])}
          m=rpc(k,'GetKernel',target).get('metadata',{})
          if m.get('isPrivate') is not True or m.get('enableGpu') is not True:
              raise SystemExit('Job privacy/GPU metadata not confirmed')
          print('PRIVATE_GPU_METADATA_OK',flush=True)
          for i in range(6):
              status=rpc(k,'GetKernelSessionStatus',target).get('status')
              if status not in ('QUEUED','RUNNING','COMPLETE','ERROR','CANCEL_REQUESTED','CANCEL_ACKNOWLEDGED','NEW_SCRIPT'):
                  raise SystemExit('Unexpected job status')
              print('GPU_JOB_STATUS: '+status,flush=True)
              if status=='COMPLETE':
                  files=rpc(k,'ListKernelSessionOutput',dict(target,pageSize=100)).get('files',[])
                  if not any(x.get('fileName')=='forge_gpu_probe.json' for x in files):raise SystemExit('GPU output missing')
                  print('GPU_JOB_OUTPUT_LISTED; output bytes not yet verified',flush=True)
                  break
              if status in ('ERROR','CANCEL_REQUESTED','CANCEL_ACKNOWLEDGED'):raise SystemExit('GPU job did not complete')
              if i<5:time.sleep(10)
          else:print('GPU_JOB_PENDING; do not submit another job',flush=True)
          PY
