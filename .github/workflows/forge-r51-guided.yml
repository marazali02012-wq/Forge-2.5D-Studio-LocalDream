name: Forge R51 guided MobileSAM CPU
on:
  push:
    branches: [forge-r51-guided-mobilesam]
    paths: ['.github/workflows/forge-r51-guided.yml']
permissions:
  contents: read
jobs:
  actual-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official checkpoint and CPU runtime
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy<2' timm==0.6.13 pillow scipy scikit-image opencv-python-headless==4.11.0.86
          git clone https://github.com/ChaoningZhang/MobileSAM.git upstream
          git -C upstream checkout f706ad9c4eb7f219c00d9050e46328518ffb65d2
          pip install --no-deps ./upstream
          echo '6dbb90523a35330fedd7f1d3dfc66f995213d81b29a5ca8108dbcdd4e37d6c2f  upstream/weights/mobile_sam.pt' | sha256sum -c
      - name: Actual R51 remove_part comparison
        run: |
          mkdir -p evidence
          export FORGE_MOBILESAM_MODEL="$PWD/upstream/weights/mobile_sam.pt"
          export PYTHONPATH="$PWD/verification/r51"
          sha256sum verification/r51/part_mask.py
          python - <<'PY'
          import io,time,json,torch,numpy as np
          from PIL import Image,ImageDraw
          from skimage import data
          from part_mask import remove_part
          torch.set_num_threads(2)
          a=np.zeros((384,384,4),np.uint8)
          a[90:311,70:206]=[25,80,170,255]
          a[150:221,205:307]=[200,60,40,255]
          gt=np.zeros(a.shape[:2],bool);gt[150:221,205:307]=True
          def photo(rgb):
              h,w=rgb.shape[:2]
              a=np.dstack((rgb,np.full((h,w),255,np.uint8)))
              a[:8,:,3]=0;a[-8:,:,3]=0;a[:,:8,3]=0;a[:,-8:,3]=0
              return a
          cases=[
            ('connected',a,(190,140,315,230),[(260,185,1),(198,180,0)],gt),
            ('face_same_box',photo(data.astronaut()),(165,60,266,181),[(218,120,1),(220,100,1),(220,165,1),(177,75,0),(250,65,0),(221,195,0)],None),
            ('face_wider',photo(data.astronaut()),(160,55,285,205),[(218,120,1),(220,100,1),(220,165,1),(177,75,0),(250,65,0),(221,195,0)],None),
            ('cup_same_box',photo(data.coffee()),(110,100,436,366),[(290,145,1),(260,220,1),(225,270,1),(140,240,0),(360,270,0),(290,35,0)],None),
            ('cup_wider',photo(data.coffee()),(120,10,430,330),[(290,145,1),(260,220,1),(225,270,1),(140,240,0),(360,270,0),(400,180,0)],None),
          ]
          results=[]
          for name,a,box,points,gt in cases:
              im=Image.fromarray(a);row={'case':name,'box':box,'points':points}
              w,h=im.size;sheet=Image.new('RGB',(w*3,h),(35,40,48));src=im.convert('RGB');sheet.paste(src,(0,0))
              for i,(mode,pts) in enumerate([('box',[]),('guided',points)],1):
                  t=time.monotonic();entry={}
                  try:
                      raw,qa=remove_part(im,box,'mobilesam',pts);o=np.array(Image.open(io.BytesIO(raw)))
                      m=(a[:,:,3]>0)&(o[:,:,3]==0)
                      assert np.array_equal(a[:,:,:3],o[:,:,:3])
                      assert np.array_equal(a[~m],o[~m])
                      assert all(bool(m[y,x])==bool(k) for x,y,k in pts)
                      entry.update(accepted=True,**qa)
                      if gt is not None:entry['iou']=float((gt&m).sum()/(gt|m).sum())
                      v=a[:,:,:3].copy();v[m]=(v[m]*.4+np.array([0,220,90])*.6).astype(np.uint8)
                      panel=Image.fromarray(v);Image.fromarray(o).save('evidence/'+name+'_'+mode+'.png')
                  except ValueError as e:
                      entry.update(accepted=False,error=str(e));panel=src.copy()
                  entry['seconds']=time.monotonic()-t;row[mode]=entry
                  d=ImageDraw.Draw(panel);d.rectangle(box,outline='yellow',width=2)
                  for x,y,k in pts:d.ellipse((x-4,y-4,x+4,y+4),fill='red' if k else 'lime',outline='black')
                  d.rectangle((0,0,145,19),fill='black');d.text((3,3),mode+(' OK' if entry['accepted'] else ' REJECT'),fill='white')
                  sheet.paste(panel,(i*w,0))
              sheet.save('evidence/'+name+'_comparison.png');results.append(row)
          print(json.dumps(results,indent=2));open('evidence/results.json','w').write(json.dumps(results,indent=2))
          assert results[0]['guided']['accepted'] and results[0]['guided']['iou']>.9
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-r51-guided-real-evidence
          path: evidence
          retention-days: 7
