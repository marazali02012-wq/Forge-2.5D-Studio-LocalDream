name: R70.19 UV and rig reuse audit
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['studio/r70-surface-lab/asset_qa.mjs','.github/workflows/forge-r70-asset-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts @gltf-transform/core@4.2.1 gltf-validator@2.0.0-dev.3.10
      - run: node studio/r70-surface-lab/asset_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r70-asset-qa
          path: |
            studio/r70-surface-lab/asset-qa/*.glb
            studio/r70-surface-lab/asset-qa/*.json
