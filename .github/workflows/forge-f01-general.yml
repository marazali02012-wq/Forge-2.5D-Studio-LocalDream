name: F01 general purpose true 3D regression
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['verification/f01/**','.github/workflows/forge-f01-general.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned genuine TripoSR CPU model dependencies
        run: |
          git init /tmp/triposr
          git -C /tmp/triposr fetch --depth 1 https://github.com/VAST-AI-Research/TripoSR.git 107cefdc244c39106fa830359024f6a2f1c78871
          git -C /tmp/triposr checkout FETCH_HEAD
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy==1.13.1 scikit-image==0.24.0 omegaconf==2.3.0 Pillow==10.4.0 einops==0.7.0 transformers==4.46.3 tokenizers==0.20.3 trimesh==4.0.5 networkx==3.4.2 huggingface-hub==0.26.5 'rembg[cpu]==2.0.61' opencv-python-headless==4.10.0.84 onnxruntime==1.20.1 numba==0.60.0 imageio==2.36.0 imageio-ffmpeg==0.5.1
          printf 'def marching_cubes(*args, **kwargs):\n    raise RuntimeError("CPU backend not installed")\n' > /tmp/triposr/torchmcubes.py
      - run: pip check
      - name: Actual inference, reimport and four angle render
        run: PYTHONPATH=/tmp/triposr OPENBLAS_NUM_THREADS=2 FORGE_CPU_THREADS=4 python verification/f01/general_static_qa.py
      - name: Real authenticated standard and high-detail static API
        run: |
          export FORGE_API_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$FORGE_API_TOKEN"
          export PYTHONPATH=/tmp/triposr OPENBLAS_NUM_THREADS=2 FORGE_CPU_THREADS=4
          python studio/cloud-ai/private_api.py > /tmp/f01-api.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
          python - <<'PY'
          import io,json,os,pathlib,struct,time,urllib.request,urllib.error
          from PIL import Image
          out=pathlib.Path('f01-evidence/api');out.mkdir(parents=True,exist_ok=True)
          image=pathlib.Path('/tmp/triposr/examples/chair.png').read_bytes()
          token=os.environ['FORGE_API_TOKEN']
          def post(path,body=image,auth=True):
              headers={'Content-Type':'image/png'}
              if auth:headers['Authorization']='Bearer '+token
              req=urllib.request.Request('http://127.0.0.1:8765'+path,data=body,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=360) as r:return r.status,r.read()
              except urllib.error.HTTPError as r:return r.code,r.read()
          assert post('/v1/generate?resolution=192',auth=False)[0]==401
          assert post('/v1/generate?resolution=256')[0]==400
          empty=io.BytesIO();Image.new('RGBA',(32,32),(0,0,0,0)).save(empty,format='PNG')
          assert post('/v1/generate?resolution=192',empty.getvalue())[0]==400
          result={}
          for res,path in [(128,'/v1/generate'),(192,'/v1/generate?resolution=192')]:
              t=time.monotonic();status,data=post(path);assert status==200,(status,data[:200])
              assert struct.unpack_from('<4sII',data)==(b'glTF',2,len(data))
              j=json.loads(data[20:20+struct.unpack_from('<I',data,12)[0]])
              assert not j.get('skins') and not j.get('animations')
              p=j['meshes'][0]['primitives'][0];n=j['accessors'][p['indices']]['count']//3
              result[str(res)]={'triangles':n,'bytes':len(data),'seconds':time.monotonic()-t}
              (out/(str(res)+'.glb')).write_bytes(data)
          assert result['192']['triangles']>result['128']['triangles'],result
          (out/'report.json').write_text(json.dumps(result,indent=2));print(result)
          PY
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts gltf-validator@2.0.0-dev.3.10
        if: always()
      - name: Independent GLB validation
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import validator from 'gltf-validator';
          const names=['chair','horse','teapot','house','seated_scene','robot_regression','chair_hd','api/128','api/192'],out={};
          for(const n of names){
            const path=n.startsWith('api/')?'f01-evidence/'+n+'.glb':'f01-evidence/'+n+'/generated.glb';
            if(!fs.existsSync(path)){out[n]={missing:true};continue;}
            const v=await validator.validateBytes(new Uint8Array(fs.readFileSync(path)));
            out[n]={errors:v.issues.numErrors,warnings:v.issues.numWarnings,messages:v.issues.messages};
          }
          fs.mkdirSync('f01-evidence',{recursive:true});fs.writeFileSync('f01-evidence/validation.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(Object.values(out).some(v=>v.missing||v.errors||v.warnings))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-f01-general-evidence
          path: f01-evidence/
