name: F01 architectural photo diversity without calibration
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['.github/workflows/forge-f01-temple-photos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install pycolmap==3.12.1 numpy==1.26.4 scipy==1.13.1 scikit-image==0.24.0 trimesh==4.0.5 networkx==3.4.2 Pillow==10.4.0 opencv-python-headless==4.10.0.84 numba==0.60.0 vtk==9.6.2
          python -m py_compile verification/f01/user_photo_worker.py
      - name: Real photos only and verified external OpenMVS
        run: |
          curl -fL --retry 2 --max-time 90 --max-filesize 20000000 https://vision.middlebury.edu/mview/data/data/templeRing.zip -o /tmp/temple.zip
          mkdir /tmp/temple /tmp/userphotos
          unzip -q /tmp/temple.zip -d /tmp/temple
          find /tmp/temple -type f -iname '*.png' -exec cp {} /tmp/userphotos/ \;
          test "$(find /tmp/userphotos -type f | wc -l)" = 47
          test "$(find /tmp/userphotos -type f ! -iname '*.png' | wc -l)" = 0
          mkdir -p temple-input-evidence
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          photos=sorted(Path('/tmp/userphotos').glob('*.png'))
          assert len(photos)==47
          sheet=Image.new('RGB',(960,360),'#202630');draw=ImageDraw.Draw(sheet)
          for j,i in enumerate([0,8,16,24,32,40]):
              im=Image.open(photos[i]).convert('RGB');im.thumbnail((310,155));x=(j%3)*320;y=(j//3)*180
              sheet.paste(im,(x+(320-im.width)//2,y));draw.text((x+8,y+157),photos[i].name,fill='white')
          sheet.save('temple-input-evidence/photos.jpg')
          PY
          curl -fL --retry 2 --max-time 120 --max-filesize 170000000 https://github.com/cdcseacave/openMVS/releases/download/v2.4.0/OpenMVS_Ubuntu_x64.zip -o /tmp/openmvs.zip
          echo '7104ae1ddd6ca38fbca9e0e4a70b20af59e21e0b497eb7181c864fbf38ca8d00  /tmp/openmvs.zip' | sha256sum -c -
          mkdir /tmp/openmvs && unzip -q /tmp/openmvs.zip -d /tmp/openmvs
          interface="$(find /tmp/openmvs -type f -name InterfaceCOLMAP -print -quit)"
          echo "OPENMVS_BIN=$(dirname "$interface")" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(find /tmp/openmvs -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd: -)" >> "$GITHUB_ENV"
          chmod +x "$(dirname "$interface")/InterfaceCOLMAP" "$(dirname "$interface")/DensifyPointCloud" "$(dirname "$interface")/ReconstructMesh"
      - name: Run real production-style photo worker without benchmark camera files
        env:
          OPENBLAS_NUM_THREADS: '2'
        run: python verification/f01/user_photo_worker.py /tmp/userphotos f01-temple-evidence --openmvs-bin "$OPENMVS_BIN" --image-up right
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts gltf-validator@2.0.0-dev.3.10
        if: always()
      - name: Independent final GLB validation
        if: ${{ success() && hashFiles('f01-temple-evidence/model.glb') != '' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import validator from 'gltf-validator';
          const d='f01-temple-evidence';const v=await validator.validateBytes(new Uint8Array(fs.readFileSync(d+'/model.glb')));
          fs.writeFileSync(d+'/validation.json',JSON.stringify(v.issues,null,2));
          if(v.issues.numErrors||v.issues.numWarnings)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-f01-temple-evidence
          path: |
            f01-temple-evidence/*.json
            f01-temple-evidence/model.glb
            f01-temple-evidence/model-views.png
            f01-temple-evidence/rejected-silhouette.glb
            f01-temple-evidence/silhouette_diagnostics/*.png
            f01-temple-evidence/dense.glb
            f01-temple-evidence/lod/report.json
            temple-input-evidence/photos.jpg
