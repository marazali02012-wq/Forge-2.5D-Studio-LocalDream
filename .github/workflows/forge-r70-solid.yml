name: Forge R70.13 solid geometry verification
on:
  push:
    branches: [forge-r70-anatomy]
    paths: ['.github/workflows/forge-r70-solid.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node studio/r70-reference/build_test_r70_13.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
      - run: node studio/r70-reference/browser_test_r70_13.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-R70-13
          path: |
            Forge_R70_13_Offline_3D_Modeler.html
            studio/r70-reference/R70_13_boolean_results.json
            studio/r70-reference/R70_13_browser.png
            studio/r70-reference/R70_13_browser.json
      - name: Save tested build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Forge_R70_13_Offline_3D_Modeler.html studio/r70-reference/R70_13_boolean_results.json studio/r70-reference/R70_13_browser.png studio/r70-reference/R70_13_browser.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "R70.13 tested standalone Manifold build"
          git push origin HEAD:forge-r70-anatomy
