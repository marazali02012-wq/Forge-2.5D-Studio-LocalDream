name: Forge Cloud AI anonymous GPU probe
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['studio/cloud-ai/probe.py','.github/workflows/forge-cloud-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triposr:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gradio_client==1.8.0 pillow==11.3.0
      - run: timeout 300 python studio/cloud-ai/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-cloud-ai-probe
          path: cloud-qa/
