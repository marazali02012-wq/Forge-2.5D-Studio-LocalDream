name: R70.22 Mesh2Motion integration and visual comparison
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['studio/r70-surface-lab/m2m_browser.js','studio/r70-surface-lab/m2m_qa.mjs','.github/workflows/forge-r70-m2m.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts @gltf-transform/core@4.2.1 gltf-validator@2.0.0-dev.3.10 three@0.180.0 esbuild@0.25.12 playwright@1.56.1
      - name: Verify official geometry identity and fetch CC0 weights
        run: |
          set -euo pipefail
          dir=studio/r70-surface-lab/rig-qa
          mkdir -p "$dir"
          root=https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data
          curl -fsSL "$root/3dobjs/base.obj" -o "$dir/upstream-base.obj"
          cmp vendor/makehuman/base.obj "$dir/upstream-base.obj"
          curl -fsSL "$root/rigs/default.mhskel" -o "$dir/default.mhskel"
          curl -fsSL "$root/rigs/default_weights.mhw" -o "$dir/default_weights.mhw"
          test "$(git hash-object "$dir/default.mhskel")" = b02cbecae00143856410d7561adf006d83bf9b3e
          test "$(git hash-object "$dir/default_weights.mhw")" = 66185806afacf87749be8e5cf6dbf66496b2a6b0
      - run: node studio/r70-surface-lab/mh_skin.mjs
      - name: Fetch pinned real Mesh2Motion source and CC0 assets
        run: |
          set -euo pipefail
          dir=studio/r70-surface-lab/deps/mesh2motion
          git init "$dir"
          git -C "$dir" remote add origin https://github.com/Mesh2Motion/mesh2motion-app.git
          git -C "$dir" sparse-checkout init --no-cone
          git -C "$dir" sparse-checkout set '/src/retarget/human-retargeting/' '/static/assets/human/model.glb' '/static/assets/human/animations/idle-a.glb' '/static/assets/human/animations/walk.glb' '/static/assets/human/animations/punch-cross.glb' '/static/assets/human/animations/hit-chest.glb' '/static/assets/human/animations/death-a.glb' '/LICENSE-MIT.MD' '/LICENSE-CC0.MD'
          git -C "$dir" fetch --depth 1 --filter=blob:none origin 2609e0345371763c4c390f751d79021285da04b1
          git -C "$dir" checkout --detach FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = 2609e0345371763c4c390f751d79021285da04b1
          mkdir -p studio/r70-surface-lab/m2m-qa
          cp "$dir"/LICENSE-*.MD studio/r70-surface-lab/m2m-qa/
      - run: npx playwright install chromium
      - run: node studio/r70-surface-lab/m2m_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r70-mesh2motion-qa
          path: studio/r70-surface-lab/m2m-qa/
