name: F01 SAM2 real foreground comparison
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['verification/f01/sam2_mask_probe.py','.github/workflows/forge-f01-sam2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-f01-sam2
  cancel-in-progress: true
jobs:
  mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies and official SAM2
        env:
          SAM2_BUILD_CUDA: '0'
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy==1.13.1 scikit-image==0.24.0 trimesh==4.0.5 networkx==3.4.2 Pillow==10.4.0 opencv-python-headless==4.10.0.84 hydra-core==1.3.2 iopath==0.1.10 tqdm==4.67.1
          git init /tmp/sam2
          git -C /tmp/sam2 fetch --depth 1 https://github.com/facebookresearch/sam2.git 2b90b9f5ceec907a1c18123530e92e794ad901a4
          git -C /tmp/sam2 checkout FETCH_HEAD
          pip install --no-build-isolation --no-deps /tmp/sam2
          pip check
      - name: Download official weights and real photo data
        run: |
          curl -fL --retry 2 --max-time 120 --max-filesize 200000000 https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt -o /tmp/sam2-tiny.pt
          curl -fL --retry 2 --max-time 90 --max-filesize 20000000 https://vision.middlebury.edu/mview/data/data/dinoSparseRing.zip -o /tmp/dino.zip
          mkdir /tmp/dino && unzip -q /tmp/dino.zip -d /tmp/dino
      - name: Real SAM2 mask and 3D comparison
        env:
          OPENBLAS_NUM_THREADS: '2'
        run: python verification/f01/sam2_mask_probe.py /tmp/dino /tmp/sam2-tiny.pt f01-sam2-evidence
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts gltf-validator@2.0.0-dev.3.10
        if: always()
      - name: Independent mesh validation
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import validator from 'gltf-validator';
          const d='f01-sam2-evidence',out={};fs.mkdirSync(d,{recursive:true});
          for(const n of ['baseline','sam2']){
            if(!fs.existsSync(d+'/'+n+'.glb')){out[n]={missing:true};continue;}
            const v=await validator.validateBytes(new Uint8Array(fs.readFileSync(d+'/'+n+'.glb')));out[n]=v.issues;
          }
          fs.writeFileSync(d+'/validation.json',JSON.stringify(out,null,2));
          if(Object.values(out).some(v=>v.missing||v.numErrors||v.numWarnings))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-f01-sam2-evidence
          path: f01-sam2-evidence/
