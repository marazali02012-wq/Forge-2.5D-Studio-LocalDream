name: Forge native Android INT8 cleanup and preview
on:
  push:
    branches: [forge-ai-int8-proof]
    paths: ['.github/workflows/forge-android-int8.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Use preinstalled Android SDK 35
        run: |
          test -n "$ANDROID_HOME"
          SDK=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            yes | "$SDK" --licenses >/dev/null || true
            "$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Prepare offline APK assets
        run: |
          bash experiments/android-int8/fetch_assets.sh android-probe-data
          mkdir -p experiments/android-int8/app/src/main/assets
          cp android-probe-data/models/* android-probe-data/robot.png experiments/android-int8/app/src/main/assets/
      - name: Assemble signed debug APK
        working-directory: experiments/android-int8
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK manifest and native ABI
        run: |
          mkdir -p android-build
          cp experiments/android-int8/app/build/outputs/apk/debug/app-debug.apk android-build/Forge_3D_Telefon_RAM_Test.apk
          unzip -l android-build/Forge_3D_Telefon_RAM_Test.apk | grep 'lib/arm64-v8a/libonnxruntime.so'
          BT=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$BT" verify --verbose android-build/Forge_3D_Telefon_RAM_Test.apk
          sha256sum android-build/*.apk > android-build/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-Android-INT8-APK
          path: android-build/
  java-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact Java core on real model
        run: |
          bash experiments/android-int8/fetch_assets.sh android-probe-data full
          curl -fL --retry 2 -o ort.jar https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.23.2/onnxruntime-1.23.2.jar
          mkdir -p java-classes java-proof-output
          javac -cp ort.jar -d java-classes experiments/android-int8/app/src/main/java/com/forgestudio/mobileprobe/Engine.java experiments/android-int8/app/src/main/java/com/forgestudio/mobileprobe/Preview.java experiments/android-int8/test/DesktopProbe.java
          read RADIUS THRESHOLD < <(python -c 'import json;d=json.load(open("android-probe-data/models/triposr-decoder-meta.json"))["params"];print(d["radius"],d["density_threshold"])')
          java -Xmx512m -Djava.awt.headless=true -cp ort.jar:java-classes com.forgestudio.mobileprobe.DesktopProbe android-probe-data java-proof-output "$RADIUS" "$THRESHOLD"
          pip install trimesh==4.9.0 numpy==2.2.6 matplotlib==3.10.7 scipy==1.15.3
          python experiments/android-int8/test/inspect_glb.py java-proof-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Forge-Java-Real-Model-Proof
          path: java-proof-output/
