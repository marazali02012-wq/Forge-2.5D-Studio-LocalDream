name: Forge R30 independent real 2D drawing
on:
  workflow_dispatch:
  push:
    branches: [forge-r23-real-inference-test]
    paths: [.github/workflows/forge-r30-image.yml]
permissions:
  contents: read
jobs:
  real-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          mkdir -p r30-proof
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy<2' pillow==10.4.0 diffusers==0.30.3 transformers==4.46.3 accelerate==0.34.2 'huggingface-hub<1' safetensors
      - name: Provision and generate real images independently of language inference
        run: |
          python -u - <<'PY'
          import json,traceback,time,hashlib
          from pathlib import Path
          import numpy as np
          from PIL import Image
          import torch
          from diffusers import StableDiffusionPipeline, EulerDiscreteScheduler
          from huggingface_hub import snapshot_download
          out=Path('r30-proof')
          report={'mock':False,'model':'IDKiro/sdxs-512-0.9','prompt_source':'R29 real Qwen 7B run 45476263239','results':[],'success':False,'visual_review_required':True}
          cases=[
              ('table','Red wooden table with four legs, no drawer.'),
              ('chair','A green wooden chair with no armrests'),
              ('ball','Draw a metallic red ball without writing')
          ]
          try:
              model=snapshot_download(report['model'],allow_patterns=['model_index.json','README.md','LICENSE*','scheduler/*','tokenizer/*','unet/config.json','unet/diffusion_pytorch_model.safetensors','vae/config.json','vae/diffusion_pytorch_model.safetensors','text_encoder/config.json','text_encoder/model.safetensors','feature_extractor/*'])
              scheduler=EulerDiscreteScheduler.from_pretrained(model,subfolder='scheduler',local_files_only=True)
              torch.set_num_threads(2)
              pipe=StableDiffusionPipeline.from_pretrained(model,scheduler=scheduler,local_files_only=True,torch_dtype=torch.float32).to('cpu')
              for name,prompt in cases:
                  start=time.monotonic()
                  with torch.inference_mode():
                      im=pipe(prompt=prompt,num_inference_steps=1,guidance_scale=0.,width=512,height=512,generator=torch.Generator(device='cpu').manual_seed(42)).images[0]
                  assert isinstance(im,Image.Image) and im.size==(512,512) and np.asarray(im).std()>4
                  f=out/(name+'.png');im.convert('RGB').save(f)
                  report['results'].append(dict(name=name,prompt=prompt,seconds=round(time.monotonic()-start,2),sha256=hashlib.sha256(f.read_bytes()).hexdigest()))
                  (out/'report.json').write_text(json.dumps(report,indent=2))
              assert len({x['sha256'] for x in report['results']})==len(cases)
              report['success']=True
          except Exception:
              report['error']=traceback.format_exc()
              raise
          finally:
              (out/'report.json').write_text(json.dumps(report,indent=2))
              print(json.dumps(report),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-r30-real-image-proof
          path: r30-proof/
          retention-days: 7
