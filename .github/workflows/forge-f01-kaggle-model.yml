name: F01 Kaggle private automatic TripoSG model
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['.github/workflows/forge-f01-kaggle-model.yml']
permissions:
  contents: read
concurrency:
  group: forge-f01-kaggle-gpu-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/forge-r70-surface-lab' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: forge-kaggle
    timeout-minutes: 6
    steps:
      - name: Submit one private real model job with quota guard
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          token=os.environ.get('KAGGLE_API_TOKEN','').strip()
          if not token.startswith('KGAT_') or len(token)<=5 or any(not 33<=ord(c)<=126 for c in token):
              raise SystemExit('Missing or malformed access token')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          def rpc(service,method,body):
              url='https://api.kaggle.com/v1/'+service+'/'+method
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'},method='POST')
              try:
                  with opener.open(req,timeout=45) as r:
                      data=json.loads(r.read(4*1024*1024))
                      print(method+': HTTP '+str(r.status),flush=True)
              except urllib.error.HTTPError as e:raise SystemExit(method+': HTTP '+str(e.code)) from None
              except Exception as e:raise SystemExit(method+': '+type(e).__name__) from None
              if not isinstance(data,dict) or data.get('error') or data.get('errorMessage') or (isinstance(data.get('code'),int) and data['code']>=400):
                  raise SystemExit(method+': API error or unexpected schema')
              return data
          d='datasets.DatasetApiService';k='kernels.KernelsApiService'
          data=rpc(d,'ListDatasets',{'group':'DATASET_SELECTION_GROUP_MY_PRIVATE','pageSize':100})
          refs={row.get('ref','') for row in data.get('datasets',[]) if row.get('isPrivate') is True and re.fullmatch(r'[a-zA-Z0-9_-]+/forge-warrior-test',row.get('ref',''))}
          if len(refs)!=1:raise SystemExit('Owner check failed; no job submitted')
          owner=refs.pop().split('/')[0]
          q=rpc(k,'GetAcceleratorQuotaStatistics',{}).get('gpuQuota')
          if not isinstance(q,dict) or q.get('isPayToScaleEnabled',False) is not False:
              raise SystemExit('Paid scaling enabled or free quota unknown; no job submitted')
          def seconds(value):
              if not isinstance(value,str) or not re.fullmatch(r'\d+(\.\d+)?s',value):raise SystemExit('Quota duration unknown; no job submitted')
              return float(value[:-1])
          remaining=seconds(q.get('totalTimeAllowed'))-seconds(q.get('timeUsed','0s'))-seconds(q.get('timeReserved','0s'))
          if remaining<7200:raise SystemExit('Less than two hours free GPU quota; no job submitted')
          print('FREE_GPU_QUOTA_CHECK_OK; paid scaling disabled',flush=True)
          run=os.environ['GITHUB_RUN_ID']
          assert run.isdigit()
          slug='forge-f01-auto-model-'+run
          source='FORGE_RUN_ID='+repr(run)+'\n'+"\"\"\"F01 private automatic GPU reproduction; research evaluation only, no commercial rights asserted.\"\"\"\nimport pathlib, torch\nbase=pathlib.Path(\"/tmp/forge-f01-kaggle\")\nbase.mkdir(exist_ok=True)\nassert pathlib.Path(\"/kaggle/working\").is_dir(),\"Use Kaggle\"\nassert torch.cuda.is_available(),\"Enable GPU\"\nprint(\"Detected GPUs:\",torch.cuda.device_count(),flush=True)\nimport os, sys, subprocess, pathlib, hashlib, urllib.request, shutil\nroot=pathlib.Path(\"/tmp/forge-f01-kaggle/forge-f01-triposg-r2\")\nvenv=pathlib.Path(\"/tmp/forge-f01-kaggle/forge-f01-py310\")\nrev=\"fc5c40990181e2a756c4e0b1c2f4d6b5202faf8c\"\nenv=dict(os.environ,HF_HUB_DISABLE_XET=\"1\",PYTHONNOUSERSITE=\"1\",PYTORCH_CUDA_ALLOC_CONF=\"expandable_segments:True\")\nenv.pop(\"PYTHONPATH\",None)\nenv[\"CUDA_VISIBLE_DEVICES\"]=\"0\"\ndef run(args,cwd=None,timeout=1800):\n    print(\"RUN:\", \" \".join(map(str,args)), flush=True)\n    subprocess.run(list(map(str,args)),cwd=cwd,env=env,check=True,timeout=timeout)\nassert torch.cuda.is_available()\nassert shutil.disk_usage(\"/tmp/forge-f01-kaggle\").free>12*2**30, \"12 GiB boş disk gerekli\"\n# Keep Colab kernel Python untouched; create an independent Python 3.10 process.\nrun([sys.executable,\"-m\",\"pip\",\"install\",\"uv==0.9.26\"])\nrun([sys.executable,\"-m\",\"uv\",\"python\",\"install\",\"3.10\"])\nif not (venv/\"bin/python\").exists():\n    run([sys.executable,\"-m\",\"uv\",\"venv\",\"--python\",\"3.10\",\"--seed\",venv])\npy=venv/\"bin/python\"\nrun([py,\"-c\",\"import sys; assert sys.version_info[:2]==(3,10); print(sys.version)\"])\nrun([py,\"-m\",\"pip\",\"install\",\"torch==2.5.1\",\"torchvision==0.20.1\",\"--index-url\",\"https://download.pytorch.org/whl/cu124\"])\nrun([py,\"-m\",\"pip\",\"install\",\"numpy==1.26.4\",\"scipy==1.11.4\",\"diffusers==0.32.2\",\"transformers==4.49.0\",\"huggingface-hub==0.28.1\",\"safetensors==0.5.3\",\"accelerate==1.4.0\",\"peft==0.14.0\",\"einops==0.8.1\",\"opencv-python-headless==4.10.0.84\",\"trimesh==4.5.3\",\"omegaconf==2.3.0\",\"scikit-image==0.24.0\",\"jaxtyping==0.2.38\",\"typeguard==2.13.3\",\"pymeshlab==2022.2.post4\",\"Pillow==11.1.0\"])\nif not root.exists():\n    run([\"git\",\"clone\",\"https://github.com/VAST-AI-Research/TripoSG.git\",root])\nrun([\"git\",\"-C\",root,\"checkout\",\"--detach\",rev])\nassert subprocess.check_output([\"git\",\"-C\",str(root),\"rev-parse\",\"HEAD\"],text=True).strip()==rev\n# Publisher-provided CPython 3.10 binary; verify its published SHA256.\nwheel=pathlib.Path(\"/tmp/forge-f01-kaggle/diso-0.1.4-cp310-cp310-linux_x86_64.whl\")\nurllib.request.urlretrieve(\"https://huggingface.co/spaces/VAST-AI/TripoSG/resolve/d51c5f2f4d5182f925a403b286d1e9faf519aaa2/\"+wheel.name,wheel)\nassert hashlib.sha256(wheel.read_bytes()).hexdigest()==\"8814512bb12ef32fe2aa8572db76cf73ee5e7f604764a37337bfd087e667dce8\", \"DISO wheel checksum mismatch\"\nrun([py,\"-m\",\"pip\",\"install\",\"--no-deps\",wheel])\nrun([py,\"-m\",\"pip\",\"check\"])\n# Verify real CUDA and compiled extension, not only import.\nrun([py,\"-c\",\"import torch; from diso import DiffDMC; assert torch.cuda.is_available(); x=torch.arange(1024,device='cuda'); assert x.sum().item()==523776; d=DiffDMC(dtype=torch.float32).cuda(); print('PY310 CUDA OK',torch.__version__,torch.version.cuda,torch.cuda.get_device_name(0))\"])\nrun([py,\"-c\",\"from scripts.inference_triposg import run_triposg; print('TripoSG import OK')\"],cwd=root)\nprint(\"AYRI PYTHON 3.10 KURULUMU VE CUDA KONTROLÜ GEÇTİ\")\n\n\nrunner=\"import json,hashlib,time,pathlib\\nimport numpy as np, torch,trimesh\\nfrom PIL import Image,ImageOps\\nfrom huggingface_hub import snapshot_download\\nfrom safetensors.torch import load_file\\nfrom scripts.inference_triposg import prepare_image,BriaRMBG,TripoSGPipeline\\nroot=pathlib.Path.cwd()\\nout=pathlib.Path(\\\"/kaggle/working/forge-f01-auto\\\")\\nout.mkdir(exist_ok=False)\\ninputs=[p for p in pathlib.Path(\\\"/kaggle/input\\\").rglob(\\\"*\\\") if p.is_file() and p.suffix.lower() in (\\\".png\\\",\\\".jpg\\\",\\\".jpeg\\\",\\\".webp\\\")]\\nassert len(inputs)==1,\\\"Expected exactly one private image\\\"\\nraw=inputs[0]\\nsha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()\\nassert sha(raw)==\\\"78be6bb8d1386e5dd443965a1cf0e236b57e1af5ab8120bbf3d31033f93391f1\\\",\\\"Unexpected input bytes\\\"\\nImage.MAX_IMAGE_PIXELS=12_000_000\\nsrc=pathlib.Path(\\\"/tmp/forge-f01-kaggle/auto-input.png\\\")\\nwith Image.open(raw) as im:\\n    assert im.format in (\\\"PNG\\\",\\\"JPEG\\\",\\\"WEBP\\\")\\n    ImageOps.exif_transpose(im).convert(\\\"RGBA\\\").save(src)\\nassert torch.cuda.is_available()\\nt=time.monotonic()\\ntripo_rev=\\\"2c1c516d22d58db486a058d98d31bb6177344e06\\\"\\nbria_rev=\\\"9921b8c152a4b24e3f559592d800f42ed7e06aeb\\\"\\ntripo=snapshot_download(\\\"VAST-AI/TripoSG\\\",revision=tripo_rev,allow_patterns=[\\\"*.json\\\",\\\"*.safetensors\\\",\\\"*.safetensors.index.json\\\",\\\"*.txt\\\"],local_dir=str(root/\\\"pretrained_weights/TripoSG-safe\\\"))\\nbria=snapshot_download(\\\"briaai/RMBG-1.4\\\",revision=bria_rev,allow_patterns=[\\\"model.safetensors\\\",\\\"config.json\\\",\\\"README.md\\\"],local_dir=str(root/\\\"pretrained_weights/RMBG-safe\\\"))\\nrmbg=BriaRMBG()\\nrmbg.load_state_dict(load_file(str(pathlib.Path(bria)/\\\"model.safetensors\\\")),strict=True)\\nrmbg=rmbg.eval().to(\\\"cuda\\\")\\npipe=TripoSGPipeline.from_pretrained(tripo,use_safetensors=True,local_files_only=True,torch_dtype=torch.float16).to(\\\"cuda\\\")\\nimg=prepare_image(str(src),bg_color=np.array([1.,1.,1.]),rmbg_net=rmbg)\\nresult=pipe(image=img,generator=torch.Generator(device=pipe.device).manual_seed(42),num_inference_steps=50,guidance_scale=7.0,use_flash_decoder=False,dense_octree_depth=8,hierarchical_octree_depth=9)\\nm=result.meshes[0]\\nassert len(m.faces)>100 and np.isfinite(m.vertices).all() and np.all(m.extents>0)\\ndest=out/\\\"model.glb\\\";m.export(dest,include_normals=True)\\nq=trimesh.load(dest,force=\\\"mesh\\\",process=False)\\nassert len(q.faces)==len(m.faces) and np.isfinite(q.vertices).all()\\nreport=dict(run_id=FORGE_RUN_ID,actual_inference=True,engine=\\\"TripoSG\\\",model_revision=tripo_rev,background_revision=bria_rev,decoder=\\\"official_hierarchical_lewiner\\\",gpu=torch.cuda.get_device_name(0),original_sha256=sha(raw),source_sha256=sha(src),glb_sha256=sha(dest),bytes=dest.stat().st_size,faces=len(q.faces),vertices=len(q.vertices),watertight=bool(q.is_watertight),seconds=time.monotonic()-t,visual_accepted=False,editor_accepted=False)\\n(out/\\\"report.json\\\").write_text(json.dumps(report,indent=2))\\nprint(\\\"FORGE_AUTO_MODEL_READY\\\",flush=True)\\n\"\nrunner=runner.replace(\"FORGE_RUN_ID\",repr(FORGE_RUN_ID))\ncompile(runner,\"forge_auto_inference.py\",\"exec\")\nscript=root/\"forge_auto_inference.py\"\nscript.write_text(runner)\nrun([py,\"-u\",script],cwd=root,timeout=1800)\nassert pathlib.Path(\"/kaggle/working/forge-f01-auto/report.json\").is_file()\n"
          compile(source,'forge_auto_model.py','exec')
          saved=rpc(k,'SaveKernel',{'slug':owner+'/'+slug,'newTitle':slug.replace('-',' '),'text':source,'language':'python','kernelType':'script','isPrivate':True,'enableGpu':True,'enableInternet':True,'enableTpu':False,'machineShape':'NvidiaTeslaT4','sessionTimeoutSeconds':3600,'kernelExecutionType':'SAVE_AND_RUN_ALL','datasetDataSources':[owner+'/forge-warrior-test'],'kernelDataSources':[],'competitionDataSources':[],'modelDataSources':[]})
          # The SaveKernel response previously differed from documented ref format.
          # Reconcile by exact unique slug, never re-submit.
          print('SAVE_RESPONSE_RECEIVED; no automatic retry',flush=True)
          target={'userName':owner,'kernelSlug':slug}
          m=rpc(k,'GetKernel',target).get('metadata',{})
          if m.get('isPrivate') is not True or m.get('enableGpu') is not True or m.get('currentVersionNumber')!=1:
              raise SystemExit('New private GPU model job metadata not verified')
          print('PRIVATE_MODEL_JOB_SUBMITTED; version 1; run '+run,flush=True)
          status=rpc(k,'GetKernelSessionStatus',target).get('status')
          if status not in ('QUEUED','RUNNING','COMPLETE','ERROR','NEW_SCRIPT','CANCEL_REQUESTED','CANCEL_ACKNOWLEDGED'):
              raise SystemExit('Unknown status')
          print('MODEL_JOB_STATUS: '+status,flush=True)
          if status in ('ERROR','CANCEL_REQUESTED','CANCEL_ACKNOWLEDGED'):
              raise SystemExit('Model job stopped')
          PY
