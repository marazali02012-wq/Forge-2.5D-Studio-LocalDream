name: V14.1 Android goruntu yukleme testi
on:
  push:
    branches: [gelistirme/webgl2-v14]
    paths:
      - Forge_25D_V14_1_Gorsel_Yukleme_Onarim.html
      - test/check_image_import_v141.py
      - .github/workflows/image-import-test.yml
jobs:
  image_import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0 Pillow==11.3.0
      - run: python -u test/check_image_import_v141.py
