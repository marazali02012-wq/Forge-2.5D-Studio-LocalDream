name: F01 Kaggle private authentication probe
on:
  workflow_dispatch:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['verification/f01/kaggle_api_probe_request.txt','.github/workflows/forge-f01-kaggle-auth.yml']
permissions:
  contents: read
jobs:
  auth:
    if: github.ref == 'refs/heads/forge-r70-surface-lab'
    runs-on: ubuntu-24.04
    environment: forge-kaggle
    timeout-minutes: 5
    steps:
      - name: Verify private dataset metadata using official Kaggle HTTPS protocol
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          token=os.environ.get('KAGGLE_API_TOKEN','').strip()
          if not token:
              raise SystemExit('AUTH NOT TESTED: secret empty')
          if not token.startswith('KGAT_'):
              raise SystemExit('AUTH NOT TESTED: expected access token prefix absent')
          if len(token)<=5:
              raise SystemExit('AUTH NOT TESTED: only token prefix saved')
          if any(ch.isspace() for ch in token):
              raise SystemExit('AUTH NOT TESTED: whitespace inside token')
          if not token.isascii():
              raise SystemExit('AUTH NOT TESTED: non-ASCII character in copied token')
          if any(not 33<=ord(ch)<=126 for ch in token):
              raise SystemExit('AUTH NOT TESTED: control character in copied token')
          # Official SDK protocol: POST /v1/{service}/{method}, JSON fields and bearer token.
          # Do not forward credentials on redirects or print response bodies.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          opener=urllib.request.build_opener(NoRedirect())
          def rpc(method,body):
              assert method in ('ListDatasets','ListDatasetFiles')
              url='https://api.kaggle.com/v1/datasets.DatasetApiService/'+method
              req=urllib.request.Request(url,data=json.dumps(body).encode(),
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'},
                  method='POST')
              try:
                  with opener.open(req,timeout=45) as r:
                      data=json.loads(r.read(4*1024*1024))
                      print(method+': HTTP '+str(r.status),flush=True)
              except urllib.error.HTTPError as e:
                  raise SystemExit(method+': HTTP '+str(e.code)+'; access not verified')
              except Exception as e:
                  raise SystemExit(method+': '+type(e).__name__+'; access not verified')
              if not isinstance(data,dict):
                  raise SystemExit(method+': unexpected JSON schema')
              if data.get('errorMessage') or data.get('error') or (isinstance(data.get('code'),int) and data['code']>=400):
                  raise SystemExit(method+': server reported an error')
              return data
          body={'group':'DATASET_SELECTION_GROUP_MY_PRIVATE','pageSize':100}
          refs=set()
          for _ in range(5):
              data=rpc('ListDatasets',body)
              rows=data.get('datasets',[])
              if not isinstance(rows,list):
                  raise SystemExit('Unexpected dataset schema')
              for row in rows:
                  ref=row.get('ref','')
                  if row.get('isPrivate') is True and re.fullmatch(r'[a-zA-Z0-9_-]+/forge-warrior-test',ref):
                      refs.add(ref)
              if refs or not data.get('nextPageToken'):
                  break
              body['pageToken']=data['nextPageToken']
          if len(refs)!=1:
              raise SystemExit('AUTH NOT VERIFIED: expected private dataset not uniquely found')
          owner,slug=refs.pop().split('/')
          data=rpc('ListDatasetFiles',{'ownerSlug':owner,'datasetSlug':slug,'pageSize':100})
          rows=data.get('datasetFiles',[])
          if not any(re.search(r'\.(png|jpe?g|webp)$',str(x.get('name','')),re.I) for x in rows):
              raise SystemExit('AUTH OK: private dataset found; image metadata not confirmed')
          print('KAGGLE_AUTH_OK: private dataset and image metadata verified; no file bytes or GPU used')
          PY
