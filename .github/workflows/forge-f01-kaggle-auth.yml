name: F01 Kaggle private authentication probe
on:
  workflow_dispatch:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['verification/f01/kaggle_api_probe_request.txt','.github/workflows/forge-f01-kaggle-auth.yml']
permissions:
  contents: read
jobs:
  auth:
    if: github.ref == 'refs/heads/forge-r70-surface-lab'
    runs-on: ubuntu-24.04
    environment: forge-kaggle
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official CLI before granting credential
        run: python -m pip install --disable-pip-version-check 'kaggle==2.2.5'
      - name: Confirm authenticated private dataset listing without publishing data
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os, subprocess, re, csv, io
          token=os.environ.get('KAGGLE_API_TOKEN','').strip()
          if not token:
              raise SystemExit('AUTH NOT TESTED: environment secret missing')
          if not token.startswith('KGAT_') or any(c.isspace() for c in token):
              raise SystemExit('AUTH NOT TESTED: token format invalid; paste only the access token')
          os.environ['KAGGLE_API_TOKEN']=token
          def cmd(*args):
              try:
                  r=subprocess.run(['kaggle',*args],capture_output=True,text=True,timeout=60)
              except subprocess.TimeoutExpired:
                  raise SystemExit('AUTH NOT VERIFIED: timeout')
              if r.returncode:
                  # Never print subprocess output: it may contain credentials or private metadata.
                  msg=(r.stdout+'\n'+r.stderr).lower()
                  reason=next((label for label,pattern in [
                      ('authentication rejected',r'\b401\b|unauthorized|invalid token'),
                      ('access forbidden',r'\b403\b|forbidden'),
                      ('resource not found',r'\b404\b'),
                      ('CLI argument mismatch',r'unrecognized arguments|invalid choice|usage:'),
                      ('network error',r'connection|timeout|resolve|ssl'),
                      ('dependency error',r'importerror|modulenotfounderror|attributeerror|typeerror'),
                  ] if re.search(pattern,msg)),'unspecified CLI error')
                  raise SystemExit('AUTH NOT VERIFIED: '+reason+'; CLI exit '+str(r.returncode))
              return r.stdout
          # No slug search filter: titles and slugs need not match search semantics.
          for page in range(1,6):
              data=cmd('datasets','list','--mine','--csv','--page',str(page))
              refs=re.findall(r'(?m)^"?([a-zA-Z0-9_-]+/forge-warrior-test)"?(?:,|\s|$)',data)
              if len(set(refs))==1:
                  listing=cmd('datasets','files',refs[0],'--csv')
                  if not re.search(r'\.(png|jpe?g|webp)(?:[,\s"]|$)',listing,re.I):
                      raise SystemExit('AUTH OK: private dataset found but image metadata not verified')
                  print('KAGGLE_AUTH_OK: private dataset and image metadata confirmed; no file bytes downloaded')
                  break
              if not data.strip() or 'no datasets found' in data.lower():
                  raise SystemExit('AUTH NOT VERIFIED: private dataset missing from own dataset listing')
          else:
              raise SystemExit('AUTH NOT VERIFIED: expected private dataset not found within 5 pages')
          PY
