name: F01 real Shap-E private text menu
on:
  push:
    branches: [forge-r70-surface-lab]
    paths: ['studio/cloud-ai/private_api_extended.py','studio/cloud-ai/f01_text_patch.mjs','verification/f01/text_menu_qa.mjs','.github/workflows/forge-f01-text-menu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: forge-f01-shape-hf-v1
      - run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers==0.35.2 transformers==4.46.3 accelerate==1.10.1 huggingface-hub==0.35.3 safetensors==0.6.2 numpy==1.26.4 scipy==1.13.1 trimesh==4.0.5 Pillow==10.4.0
          pip check
          python -m py_compile studio/cloud-ai/private_api_extended.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 gltf-validator@2.0.0-dev.3.10
      - run: npx playwright install chromium
      - run: node studio/cloud-ai/ai_import_patch.mjs && node studio/cloud-ai/connected_patch.mjs && node studio/cloud-ai/f01_text_patch.mjs
      - name: Actual authenticated text-to-GLB from mobile browser
        env:
          HF_HUB_DISABLE_XET: '1'
          OPENBLAS_NUM_THREADS: '2'
          FORGE_TEXT_ENABLED: '1'
          FORGE_ALLOWED_ORIGINS: http://127.0.0.1:8766
        run: |
          export FORGE_API_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$FORGE_API_TOKEN"
          python studio/cloud-ai/private_api_extended.py > /tmp/forge-text-api.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
          node verification/f01/text_menu_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-f01-text-menu-evidence
          path: |
            Forge_R70_34_F01_Text_Experimental.html
            f01-text-menu-evidence/
