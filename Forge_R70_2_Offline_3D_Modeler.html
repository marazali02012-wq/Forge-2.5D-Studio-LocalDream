function preset(){parts=makeCharacter($("bodyType").value);selected=0;ui();refresh()}
document.querySelectorAll("[data-shape]").forEach(b=>b.onclick=()=>add(part(b.dataset.shape)));
$("preset").onclick=()=>{if(!parts.length||confirm("Mevcut model değişsin mi?"))preset()};$("clear").onclick=()=>{if(confirm("Tüm parçalar silinsin mi?")){parts=[];selected=-1;ui();refresh()}};$("copy").onclick=()=>{if(parts[selected]){const p=JSON.parse(JSON.stringify(parts[selected]));p.t[0]=Math.min(10,p.t[0]+.25);add(p)}};$("mirror").onclick=()=>{if(parts[selected]){const p=JSON.parse(JSON.stringify(parts[selected]));p.t[0]*=-1;p.r[1]*=-1;p.r[2]*=-1;add(p)}};$("del").onclick=()=>{if(selected>=0){parts.splice(selected,1);selected=Math.min(selected,parts.length-1);ui();refresh()}};$("reset").onclick=()=>{yaw=.35;pitch=.13;zoom=3.2;draw()};$("front").onclick=()=>{yaw=0;pitch=0;draw()};$("back").onclick=()=>{yaw=Math.PI;pitch=0;draw()};$("side").onclick=()=>{yaw=Math.PI/2;pitch=0;draw()};function changeZoom(f){zoom=Math.max(1.8,Math.min(25,zoom*f));draw()}$("closer").onclick=()=>changeZoom(.82);$("farther").onclick=()=>changeZoom(1.22);
function download(data,type,name){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$("save").onclick=()=>{if(parts.length)download(glb(mesh(parts)),"model/gltf-binary","Forge_R70_2.glb")};$("project").onclick=()=>download(JSON.stringify({version:1,parts}),"application/json","Forge_R70_2.json");$("load").onclick=()=>$("file").click();$("file").onchange=async()=>{try{const f=$("file").files[0];if(!f)return;if(f.size>100000)throw Error("Dosya çok büyük");const j=JSON.parse(await f.text());if(j.version!==1||!Array.isArray(j.parts)||j.parts.length>100||!j.parts.every(p=>p&&["box","sphere","cylinder","cone","torso","head","arm","leg","palm","boot","plate"].includes(p.type)&&(!("profile" in p)||(Object.hasOwn(PROFILES,p.type)&&validProfile(p.profile)))&&/^#[0-9a-f]{6}$/i.test(p.color)&&["t","s","r"].every(k=>Array.isArray(p[k])&&p[k].length===3&&p[k].every(v=>typeof v==="number"&&Number.isFinite(v)&&Math.abs(v)<=(k==="r"?360:10)&&(k!=="s"||v>=.02)))))throw Error("Geçersiz proje");parts=j.parts;selected=parts.length?0:-1;ui();refresh()}catch(e){alert(e.message)}finally{$("file").value=""}};
let pointer=null;cv.onpointerdown=e=>{if(pointer)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!pointer||pointer.id!==e.pointerId)return;yaw+=(e.clientX-pointer.x)*.012;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-pointer.y)*.012));pointer.x=e.clientX;pointer.y=e.clientY;draw()};cv.onpointerup=cv.onpointercancel=e=>{if(pointer&&pointer.id===e.pointerId)pointer=null};cv.onwheel=e=>{e.preventDefault();changeZoom(Math.exp(e.deltaY*.001))};new ResizeObserver(draw).observe(cv);try{init()}catch(e){alert("3D görüntüleme hatası: "+e.message)}preset();
</script></body></html>
