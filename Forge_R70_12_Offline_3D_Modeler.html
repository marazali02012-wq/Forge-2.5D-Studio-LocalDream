      { y: yC + 0.04, rx: Bd.hipW * 0.46, rz: Bd.hipD * 0.47, w: W('hips', 1), col: under, mat: MAT.under },
      { y: yH, rx: Bd.hipW * 0.52 * bk, rz: Bd.hipD * 0.52 * bk, w: W('hips', 1), col: under, mat: MAT.under },
      { y: (yH + yW) / 2, rx: Bd.waistW * 0.52 * bk, rz: Bd.waistD * 0.52 * bk, w: W('hips', 0.6, 'spine', 0.4), col: torsoCol, mat: torsoMat },
      { y: yW, rx: Bd.waistW * 0.5 * bk, rz: Bd.waistD * 0.5 * bk, w: W('spine', 0.8, 'hips', 0.2), col: torsoCol, mat: torsoMat },
      { y: yLc, rx: Bd.chestW * 0.5 * bk, rz: Bd.chestD * 0.5 * bk, w: W('spine', 0.5, 'chest', 0.5), col: torsoCol, mat: torsoMat },
      { y: yCh, rx: Bd.chestW * 0.55 * bk, rz: Bd.chestD * 0.55 * bk, w: W('chest', 1), col: torsoCol, mat: torsoMat },
      { y: (yCh + yS) / 2, rx: Bd.shoulderW * 0.47 * bk, rz: Bd.chestD * 0.5 * bk, w: W('chest', 1), col: torsoCol, mat: torsoMat },
      { y: yS, rx: Bd.shoulderW * 0.36, rz: Bd.chestD * 0.40, w: W('chest', 1), col: torsoCol, mat: torsoMat },
      { y: yN - 0.02, rx: 0.075, rz: 0.07, w: W('chest', 0.6, 'neck', 0.4), col: under, mat: MAT.under },
    ].map(r => ({ c: [0, r.y, r.y > yLc ? -0.012 : 0], t: [0, 1, 0], side: [1, 0, 0], rx: r.rx, rz: r.rz, n: 2.6, col: r.col, mat: r.mat, w: r.w }));
    B.tube(tr, 20, { capStart: true });
    B.endPart();

    // Göğüs zırhı plakası (ön kabuk) + altın kenar
    if (heavy > 0.3 && !robe) {
      B.beginPart('breastplate');
      const rows = [];
      const n = 7;
      for (let i = 0; i <= n; i++) {
        const s = i / n, y = yW + (yS - 0.02 - yW) * s;
        const wdt = (Bd.waistW + (Bd.chestW * 1.08 - Bd.waistW) * Math.min(1, s * 1.5)) * 0.5 * bk * 1.07;
        const dep = (Bd.waistD + (Bd.chestD * 1.06 - Bd.waistD) * Math.min(1, s * 1.5)) * 0.5 * bk * 1.12;
        const edge = i === 0 || i === n;
        rows.push({ c: [0, y, y > yLc ? -0.006 : 0.004], t: [0, 1, 0], side: [1, 0, 0], rx: wdt, rz: dep * (s > 0.85 ? 0.92 : 1), n: 2.4,
          col: (u) => edge ? trim : (Math.abs(u - 0.75) < 0.02 ? trim : shade(metal, 1.0 + 0.08 * Math.cos(u * 12.5))),
          mat: (u) => edge || Math.abs(u - 0.75) < 0.02 ? MAT.trim : MAT.metal,
          w: s < 0.3 ? W('spine', 0.8, 'hips', 0.2) : s < 0.6 ? W('spine', 0.5, 'chest', 0.5) : W('chest', 1) });
      }
      B.tube(rows, 24);
      B.endPart();
      // Curved armor: sample underlying torso section and build finite-thickness curved shells.
      const sectionAt=y=>{
        let k=0;while(k<rows.length-2&&rows[k+1].c[1]<y)k++;
        const a=rows[k],b=rows[k+1],t=clamp((y-a.c[1])/(b.c[1]-a.c[1]),0,1);
        return {rx:a.rx+(b.rx-a.rx)*t,rz:a.rz+(b.rz-a.rz)*t,z:a.c[2]+(b.c[2]-a.c[2])*t};
      };
      function shell(name,y0,y1,a0,a1,color,material,bone,relief=.008){
        B.beginPart(name);
        const N=16,M=5,base=B.pos.length/3,thick=.012,w=W(bone,1);
        const at=(i,j,outer)=>{
          const v=i/M,u=j/N,a=a0+(a1-a0)*u,y=y0+(y1-y0)*v;
          const d=sectionAt(y),r=outer?relief+ .007*Math.sin(Math.PI*u)*Math.sin(Math.PI*v):relief-thick;
          const cx=Math.sign(Math.sin(a))*Math.pow(Math.abs(Math.sin(a)),2/2.4);
          const cz=Math.pow(Math.max(0,Math.cos(a)),2/2.4);
          return [(d.rx+r)*cx,y-.012*Math.sin(Math.PI*u),d.z+(d.rz+r)*cz];
        };
        for(let l=0;l<2;l++)for(let i=0;i<=M;i++)for(let j=0;j<=N;j++){
          const p=at(i,j,l===0),a=at(i,Math.max(0,j-1),l===0),b=at(i,Math.min(N,j+1),l===0),c=at(Math.max(0,i-1),j,l===0),d=at(Math.min(M,i+1),j,l===0);
          let n=v3.norm(v3.cross(v3.sub(b,a),v3.sub(d,c)));if(n[2]<0)n=v3.scale(n,-1);if(l)n=v3.scale(n,-1);
          B.vert(p,n,[j/N,i/M],color,material,w);
        }
        const stride=(M+1)*(N+1),ix=(l,i,j)=>base+l*stride+i*(N+1)+j;
        const quad=(a,b,c,d)=>B.idx.push(a,b,c,a,c,d);
        for(let i=0;i<M;i++)for(let j=0;j<N;j++){quad(ix(0,i,j),ix(0,i,j+1),ix(0,i+1,j+1),ix(0,i+1,j));quad(ix(1,i,j),ix(1,i+1,j),ix(1,i+1,j+1),ix(1,i,j+1))}
        for(let j=0;j<N;j++){quad(ix(0,0,j),ix(1,0,j),ix(1,0,j+1),ix(0,0,j+1));quad(ix(0,M,j),ix(0,M,j+1),ix(1,M,j+1),ix(1,M,j))}
        for(let i=0;i<M;i++){quad(ix(0,i,0),ix(0,i+1,0),ix(1,i+1,0),ix(1,i,0));quad(ix(0,i,N),ix(1,i,N),ix(1,i+1,N),ix(0,i+1,N))}
        B.endPart();
      }
      const top=yS-.035,bottom=yW+.13;
      for(const s of [-1,1]){
        shell('chest.panel.'+(s<0?'R':'L'),bottom,top,s<0?-1.12:.045,s<0?-.045:1.12,shade(metal,.94),MAT.metal,'chest',.008);
      }
      shell('chest.keel',yW+.035,top,-.055,.055,shade(metal,1.19),MAT.metal,'chest',.014);
      for(let k=0;k<3;k++)shell('abdomen.lame.'+k,yW+.005+k*.043,yW+.047+k*.043,-1.27,1.27,shade(metal,.78+k*.07),MAT.metal,'spine',.007+k*.001);
      // Göğüs mücevheri
      B.beginPart('chest_gem');
      B.ellipsoid([0, yCh + 0.02, sectionAt(yCh+.02).z+sectionAt(yCh+.02).rz+.014], [0.015, 0.019, 0.009], [0, 1, 0], [1, 0, 0], 8, 5, pal.gem, MAT.gem, W('chest', 1));
      B.endPart();
    }

    // ---------- BOYUN & BAŞ ----------
    B.beginPart('neck');
    B.tube(ringsAlong([0, Bd.neckY - 0.03, -0.005], [0, Bd.headY + 0.04, 0.0], s => ({ rx: 0.055, rz: 0.058, col: pal.skin, mat: MAT.skin, w: s < 0.5 ? W('neck', 1) : W('neck', 0.5, 'head', 0.5) }), [1, 0, 0], 3), 12);
    B.endPart();

    const hc = [0, Bd.headY + Bd.headH * 0.47, 0.012];
    const hr = [Bd.headW * 0.5, Bd.headH * 0.52, Bd.headW * 0.56];
    // Continuous anatomical head. Local y and polar angle control jaw, cheek, brow, nose and lips.
    const eyeY=hc[1]+hr[1]*.045, hw=W('head',1), N=48,M=36;
    function headPoint(u,v){
      const y=-1+2*v, a=u*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
      const r=Math.sqrt(Math.max(.0004,1-y*y));
      const jaw=.79+.21*clamp((y+.76)/.65,0,1);
      let x=c*r*hr[0]*jaw, z=s*r*hr[2]*(s>0?.92:1.02);
      const g=(xx,yy,sx,sy)=>Math.exp(-(((x/hr[0]-xx)/sx)**2+((y-yy)/sy)**2));
      if(s>0){
        const front=s**5;
        z+=hr[2]*front*(.32*g(0,-.12,.17,.21)+.12*g(0,.09,.13,.28)
          -.19*g(.40,.07,.22,.16)-.19*g(-.40,.07,.22,.16)
          +.085*g(.46,-.19,.26,.22)+.085*g(-.46,-.19,.26,.22)
          +.08*g(.37,.27,.26,.12)+.08*g(-.37,.27,.26,.12)
          +.105*g(0,-.48,.33,.14)+.10*g(0,-.73,.35,.14));
      }
      return [hc[0]+x,hc[1]+y*hr[1],hc[2]+z];
    }
    B.beginPart('head');
    const vb=B.pos.length/3;
    for(let i=0;i<=M;i++)for(let k=0;k<=N;k++){
      const u=k/N,v=i/M,p=headPoint(u,v);
      const du=v3.sub(headPoint(u+1/N,v),headPoint(u-1/N,v)),dv=v3.sub(headPoint(u,Math.min(1,v+1/M)),headPoint(u,Math.max(0,v-1/M)));
      let n=v3.norm(v3.cross(dv,du));if(v3.dot(n,v3.sub(p,hc))<0)n=v3.scale(n,-1);
      B.vert(p,n,[u,v],pal.skin,MAT.skin,hw);
    }
    for(let i=0;i<M;i++)for(let k=0;k<N;k++){const a=vb+i*(N+1)+k,b=a+1,c=a+N+1,d=c+1;B.idx.push(a,b,c,b,d,c)}
    for(const i of [0,M]){const n=[0,i===0?-1:1,0],q=B.vert([hc[0],hc[1]+n[1]*hr[1],hc[2]],n,[.5,i/M],pal.skin,MAT.skin,hw);for(let k=0;k<N;k++){const a=vb+i*(N+1)+k;B.idx.push(q,a,a+1)}}
    B.endPart();
    // Keep the prior part identifier for independent editing of ear and jaw accents.
    B.beginPart('jaw');
    for(const side of [-1,1]){
      B.ellipsoid([side*hr[0]*.94,hc[1]-hr[1]*.03,hc[2]-.008],[.015,.029,.018],[0,1,0],[1,0,0],12,8,pal.skin,MAT.skin,hw);
      B.ellipsoid([side*hr[0]*1.045,hc[1]-hr[1]*.03,hc[2]-.004],[.004,.015,.010],[0,1,0],[1,0,0],8,6,shade(pal.skin,.70),MAT.skin,hw);
    }
    B.endPart();
    B.beginPart('face');
    // Find front surface at a given horizontal position and height, rather than floating features.
    function frontAt(x,y){
      const v=clamp((y-hc[1])/hr[1]*.5+.5,0,1);
      let lo=0,hi=.5;
      for(let i=0;i<24;i++){let u=(lo+hi)/2;if(headPoint(u,v)[0]>x)lo=u;else hi=u}
      return headPoint((lo+hi)/2,v)[2];
    }
    for(const side of [-1,1]){
      const x=side*hr[0]*.40,z=frontAt(x,eyeY);
      B.ellipsoid([x,eyeY,z-.002],[.0135,.0055,.0055],[0,1,0],[1,0,0],12,6,[186,178,160],MAT.skin,hw);
      B.ellipsoid([x,eyeY,z+.003],[.0048,.0046,.0025],[0,1,0],[1,0,0],10,6,[65,49,35],MAT.dark,hw);
      B.ellipsoid([x,eyeY,z+.005],[.0025,.0025,.0015],[0,1,0],[1,0,0],8,5,pal.dark,MAT.dark,hw);
      for(const upper of [true,false]){
        const rings=[];
        for(let i=0;i<=12;i++){
          const t=i/12,xx=x+(t-.5)*.029,yy=eyeY+(upper?1:-1)*(.001+.0058*Math.sin(Math.PI*t))+.0015*side*(t-.5);
          rings.push({c:[xx,yy,Math.max(frontAt(xx,yy)+.0006,z+.0015)],t:[1,0,0],side:[0,1,0],rx:.0009+.0016*Math.sin(Math.PI*t),rz:.0017,col:shade(pal.skin,upper?.78:.94),mat:MAT.skin,w:hw});
        }
        B.tube(rings,8,{capStart:true,capEnd:true});
      }
      const by=eyeY+.016,br=[];
      for(let i=0;i<=8;i++){let t=i/8,xx=x+(t-.5)*.035,yy=by+.004*Math.sin(Math.PI*t)-.002*side*(t-.5);br.push({c:[xx,yy,frontAt(xx,yy)+.0008],t:[1,0,0],side:[0,1,0],rx:.001+.0023*Math.sin(Math.PI*t),rz:.0015,col:shade(pal.hair,.9),mat:MAT.hair,w:hw})}
      B.tube(br,6,{capStart:true,capEnd:true});
      const ny=hc[1]-hr[1]*.24,nx=side*.009;
      B.ellipsoid([nx,ny,frontAt(nx,ny)+.0005],[.0033,.0018,.0017],[0,1,0],[1,0,0],8,5,shade(pal.skin,.52),MAT.skin,hw);
    }
    const mouthY=hc[1]-hr[1]*.49;
    for(const layer of [-1,0,1]){
      const rings=[];
      for(let i=0;i<=18;i++){
        let t=i/18,x=(t-.5)*.042,arch=Math.sin(Math.PI*t),y=mouthY+.0018*(1-arch)+layer*.0023*arch;
        rings.push({c:[x,y,frontAt(x,y)+.0006+(layer===0?.0018:.001)],t:[1,0,0],side:[0,1,0],rx:.00055+arch*(layer===0?.0007:.0021),rz:.0008+arch*.0015,col:shade(pal.skin,layer===0?.49:layer===1?.81:.93),mat:MAT.skin,w:hw});
      }
      B.tube(rings,8,{capStart:true,capEnd:true});
    }
    B.endPart();

    // Saç
    if(st.hair==='short'){
      B.beginPart('hair',{estimated:true});
      const sn=48,sm=22,base=B.pos.length/3;
      function hairPoint(u,v){
        const a=u*Math.PI*2,f=Math.sin(a),side=Math.abs(Math.cos(a));
        const line=.07+.34*Math.max(0,f)-.48*Math.max(0,-f)+.13*side**8+.035*Math.sin(5*a)*Math.max(0,f);
        const y=line+(1-line)*v,p=headPoint(u,(y+1)/2),d=v3.norm(v3.sub(p,hc));
        const thickness=.004+.009*Math.sin(v*Math.PI/2)+.0025*Math.sin(a*12+v*5)**2*Math.sin(v*Math.PI);
        return v3.add(p,v3.scale(d,thickness));
      }
      for(let i=0;i<=sm;i++)for(let j=0;j<=sn;j++){
        const u=j/sn,v=i/sm,p=hairPoint(u,v),du=v3.sub(hairPoint(u+1/sn,v),hairPoint(u-1/sn,v)),dv=v3.sub(hairPoint(u,Math.min(1,v+1/sm)),hairPoint(u,Math.max(0,v-1/sm)));
        let n=v3.norm(v3.cross(dv,du));if(v3.dot(n,v3.sub(p,hc))<0)n=v3.scale(n,-1);
        B.vert(p,n,[u,v],shade(pal.hair,.91+.10*Math.sin(u*Math.PI*24+v*5)**2),MAT.hair,hw);
      }
      for(let i=0;i<sm;i++)for(let j=0;j<sn;j++){let a=base+i*(sn+1)+j,b=a+1,c=a+sn+1,d=c+1;B.idx.push(a,b,c,b,d,c)}
      const cap=B.vert([hc[0],hc[1]+hr[1]+.013,hc[2]],[0,1,0],[.5,1],pal.hair,MAT.hair,hw);
      for(let j=0;j<sn;j++){let a=base+sm*(sn+1)+j;B.idx.push(cap,a,a+1)}
      B.endPart();
    }else if (st.hair !== 'none') {
      B.beginPart('hair', { estimated: true });
      B.ellipsoid([hc[0], hc[1] + hr[1] * 0.16, hc[2] - hr[2] * 0.16], [hr[0] * 1.09, hr[1] * 0.98, hr[2] * 1.02], [0, 1, 0], [1, 0, 0], 18, 9, pal.hair, MAT.hair, W('head', 1), { from: 0.12, to: 1, capStart: false });
      // ense saçı (arka-alt)
      B.ellipsoid([hc[0], hc[1] - hr[1] * 0.05, hc[2] - hr[2] * 0.42], [hr[0] * 0.98, hr[1] * 0.62, hr[2] * 0.62], [0, 1, 0], [1, 0, 0], 14, 7, shade(pal.hair, 0.92), MAT.hair, W('head', 1));
      if (st.hair === 'spiky' || st.hair === 'long') {
        const count = st.hair === 'long' ? 9 : 13;
        for (let k = 0; k < count; k++) {
          const a = (k / count) * Math.PI * 1.6 - Math.PI * 0.8 + Math.PI; // arka ve yanlar
          const up = st.hair === 'long' ? -0.55 : 0.35 + R() * 0.4;
          const base = [hc[0] + Math.sin(a) * hr[0] * 0.95, hc[1] + hr[1] * (0.35 + R() * 0.25), hc[2] + Math.cos(a) * hr[2] * 0.95];
          const dir = v3.norm([Math.sin(a) * 0.8, up, Math.cos(a) * 0.8]);
          const len = st.hair === 'long' ? 0.16 + R() * 0.06 : 0.06 + R() * 0.05;
          B.tube(ringsAlong(base, v3.add(base, v3.scale(dir, len)), s => ({ rx: 0.026 * (1 - s) + 0.002, rz: 0.018 * (1 - s) + 0.002, col: shade(pal.hair, 0.9 + 0.2 * (1 - s)), mat: MAT.hair, w: W('head', 1) }), [1, 0, 0], 2), 6, { capStart: true });
        }
        // alın perçemi
        for (let k = 0; k < 4; k++) {
          const x = (k - 1.5) * hr[0] * 0.42;
          const base = [x, hc[1] + hr[1] * 0.62, hc[2] + hr[2] * 0.55];
          const tip = [x * 1.15 + (R() - 0.5) * 0.02, hc[1] + hr[1] * 0.25, hc[2] + hr[2] * 0.98];
          B.tube(ringsAlong(base, tip, s => ({ rx: 0.022 * (1 - s) + 0.002, rz: 0.012 * (1 - s) + 0.002, col: pal.hair, mat: MAT.hair, w: W('head', 1) }), [1, 0, 0], 2), 6, { capStart: true });
        }
      }
      B.endPart();
    }
    // Miğfer / taç
    if (st.helmet === 'circlet' || st.helmet === 'full') {
      B.beginPart('helmet');
      const band = [];
      const by = hc[1] + hr[1] * 0.36;
      for (let i = 0; i <= 1; i++) band.push({ c: [0, by + i * 0.035, hc[2] - 0.004], t: [0, 1, 0], side: [1, 0, 0], rx: hr[0] * 1.13, rz: hr[2] * 1.12, col: trim, mat: MAT.trim, w: W('head', 1) });
      B.tube(band, 22);
      // ön taç plakası ve mücevher
      B.extrude([[-0.05, 0], [0.05, 0], [0.035, 0.05], [0, 0.085], [-0.035, 0.05]], [0, by + 0.005, hc[2] + hr[2] * 1.08], [1, 0, 0], [0, 1, 0], 0.012, trim, MAT.trim, W('head', 1));
      B.ellipsoid([0, by + 0.035, hc[2] + hr[2] * 1.11], [0.012, 0.016, 0.008], [0, 1, 0], [1, 0, 0], 8, 4, pal.gem, MAT.gem, W('head', 1));
      if (st.helmet === 'full') {
        B.ellipsoid([hc[0], hc[1] + hr[1] * 0.1, hc[2] - 0.005], [hr[0] * 1.15, hr[1] * 1.04, hr[2] * 1.14], [0, 1, 0], [1, 0, 0], 18, 10, metal, MAT.metal, W('head', 1), { from: 0.05, to: 1 });
        // yanak koruyucular
        for (const s of [1, -1]) B.extrude([[0, 0], [0.05, 0], [0.04, -0.09], [0, -0.07]], [s * hr[0] * 0.9, hc[1] + hr[1] * 0.1, hc[2] + hr[2] * 0.35], [0, 0, s], [0, 1, 0], 0.012, metal, MAT.metal, W('head', 1));
      }
      B.endPart();
    }

    if(st.helmet==='warhelm'){
      B.beginPart('warhelm');
      const ww=W('head',1);
      // Closed helmet with a curved visor and actual eye opening (two separate shell bands).
      const cx=hc[0],cz=hc[2],ry=hr[1],rx=hr[0]*1.20,rz=hr[2]*1.19;
      const shellRows=[
        {y:eyeY-.015,k:1.03},{y:eyeY+.012,k:1.04},{y:hc[1]+ry*.48,k:1.01},{y:hc[1]+ry*.83,k:.71},{y:hc[1]+ry*1.10,k:.05}
      ].map(o=>({c:[cx,o.y,cz],t:[0,1,0],side:[1,0,0],rx:rx*o.k,rz:rz*o.k,col:metal,mat:MAT.metal,w:ww,n:2.15}));
      B.tube(shellRows,32,{capEnd:true});
      const chinRows=[{y:hc[1]-ry*.90,k:.76},{y:hc[1]-ry*.62,k:.91},{y:eyeY-.032,k:1.02}].map(o=>({c:[cx,o.y,cz+.003],t:[0,1,0],side:[1,0,0],rx:rx*o.k,rz:rz*o.k,col:shade(metal,.84),mat:MAT.metal,w:ww,n:2.1}));
      B.tube(chinRows,32,{capStart:true});
      for(const side of [-1,1]){
        B.ellipsoid([side*rx*.83,eyeY-.021,cz],[rx*.23,ry*.53,rz*.72],[0,1,0],[1,0,0],12,7,shade(metal,.91),MAT.metal,ww);
      }
      B.extrude([[-.009,-.047],[.009,-.047],[.012,.044],[-.012,.044]],[0,eyeY,cz+rz*.98],[1,0,0],[0,1,0],.012,trim,MAT.trim,ww,.006);
      B.endPart();
    }
    // ---------- KOLLAR ----------
    for (const [S, s] of [['L', 1], ['R', -1]]) {
      const sh = P('upperarm.' + S), el = P('forearm.' + S), wr = P('hand.' + S);
      const shIn = v3.add(sh, [-s * 0.05, 0.01, 0]);
      B.beginPart('upperarm.' + S);
      const armCol = heavy > 0.5 ? shade(metal, 0.92) : (robe ? cloth : under), armMat = heavy > 0.5 ? MAT.metal : (robe ? MAT.cloth : MAT.under);
      B.tube(ringsAlong(shIn, el, t => ({ rx: Bd.armR * bk * (.84 + .28*Math.sin(Math.PI*t) + .12*(1-t)), rz: Bd.armR * bk * (.85+.31*Math.sin(Math.PI*t)+.12*(1-t)), col: armCol, mat: armMat,
